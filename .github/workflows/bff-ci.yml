name: BFF Service - CI

on:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov httpx
        if [ -f bff-service/requirements.txt ]; then pip install -r bff-service/requirements.txt; fi

    - name: Run tests with pytest
      env:
        ENV: DEV
      run: |
        cd bff-service
        pytest tests/ --cov=app --cov-report=xml:coverage.xml --cov-fail-under=50

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@master
      with:
        projectBaseDir: bff-service
        args: >
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.branch.name=master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Login to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      if: github.event_name == 'push'
      uses: docker/build-push-action@v5
      with:
        context: ./bff-service
        file: ./bff-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/devops-bff-service:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/devops-bff-service:${{ github.sha }}